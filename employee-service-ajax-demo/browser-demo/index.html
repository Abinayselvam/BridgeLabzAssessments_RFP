<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Service AJAX Promise Demo</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #111827;
      }

      .container {
        max-width: 900px;
        margin: 40px auto;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        padding: 30px;
      }

      h1 {
        margin-top: 0;
      }

      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        cursor: pointer;
        font-size: 14px;
      }

      button:hover {
        background: #1d4ed8;
      }

      #status {
        margin: 20px 0;
        font-weight: bold;
        color: #1f2937;
      }

      ul {
        list-style: none;
        padding: 0;
        margin-top: 20px;
      }

      li {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 10px;
        background: #f9fafb;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Employee Service</h1>
      <p>Demonstrates an AJAX Promise call to an HTTP service in the browser.</p>
      <button id="loadEmployeesBtn">Load Employees</button>
      <div id="status">Status: Waiting</div>
      <ul id="employeeList"></ul>
    </div>

    <script src="app.js"></script>
  </body>
</html>
