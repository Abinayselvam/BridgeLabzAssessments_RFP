<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Payroll App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <section class="card payroll-card" aria-labelledby="appTitle">
      <div class="card-accent"></div>

      <header class="card-header">
        <p class="eyebrow">Employee Payroll</p>
        <h1 id="appTitle">Employee Payroll Management</h1>
        <p class="subtext">Add, edit, and delete employees. Records are saved locally in your browser.</p>
      </header>

      <form id="employeeForm" class="employee-form" novalidate>
        <input type="hidden" id="recordId">

        <div class="form-row">
          <div class="field">
            <label for="empName">Name</label>
            <input type="text" id="empName" name="empName" placeholder="e.g. Priya Sharma" required autocomplete="name">
            <span class="error" id="empNameError"></span>
          </div>

          <div class="field">
            <label for="empId">Employee ID</label>
            <input type="text" id="empId" name="empId" placeholder="e.g. EMP-1042" required>
            <span class="error" id="empIdError"></span>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="department">Department</label>
            <select id="department" name="department" required>
              <option value="" disabled selected>Select department</option>
              <option value="Engineering">Engineering</option>
              <option value="Sales">Sales</option>
              <option value="Marketing">Marketing</option>
              <option value="Human Resources">Human Resources</option>
              <option value="Finance">Finance</option>
              <option value="Operations">Operations</option>
            </select>
            <span class="error" id="departmentError"></span>
          </div>

          <div class="field">
            <label for="salary">Salary <span class="unit">(per annum, ₹)</span></label>
            <input type="number" id="salary" name="salary" placeholder="e.g. 600000" min="0" step="1000" required>
            <span class="error" id="salaryError"></span>
          </div>
        </div>

        <div class="form-actions">
          <button type="reset" class="btn btn-secondary">Clear</button>
          <button type="submit" class="btn btn-primary">Save Employee</button>
        </div>

        <p class="form-status" id="formStatus" role="status"></p>
      </form>

      <div class="table-header">
        <div>
          <h2>Payroll Records</h2>
          <p class="subtext">Search and manage your current employee list.</p>
        </div>
        <div class="toolbar">
          <input type="search" id="searchInput" placeholder="Search by name, ID, or department">
          <button type="button" id="clearAllBtn" class="btn btn-secondary">Clear All</button>
        </div>
      </div>

      <div class="table-wrapper">
        <table id="employeeTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>ID</th>
              <th>Department</th>
              <th>Salary</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p class="empty-state" id="emptyState">No employees found. Add a new employee to get started.</p>
      </div>

      <div class="summary" id="summary"></div>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
