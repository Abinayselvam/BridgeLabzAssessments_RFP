<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Employee Payroll Home Page</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,600;1,500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <div class="brand"><div class="brand-logo">✦</div><div><div class="brand-title">EMPLOYEE</div><div class="brand-subtitle">PAYROLL</div></div></div>
  <div class="employee-summary"><span id="employeeCount">0</span><span>Employee Details</span></div>
  <button id="addEmployeeButton" class="add-button">+ Add Employee</button>
</header>
<main class="page">
<section class="page-heading"><h1>Employee Payroll Details</h1><p>Manage employee payroll information</p></section>
<section class="table-card">
<div class="table-toolbar"><div><h2>Employee Details</h2><p id="departmentSummary">All Departments</p></div><div class="department-filter"><label for="departmentFilter">Department</label><select id="departmentFilter"><option value="ALL">All Departments</option></select></div></div>
<div class="table-wrapper"><table><thead><tr><th>PROFILE</th><th>NAME</th><th>GENDER</th><th>DEPARTMENT</th><th>SALARY</th><th>START DATE</th><th>BENEFITS</th><th>NOTES</th></tr></thead><tbody id="employeeTableBody"></tbody></table></div>
</section></main>
<script src="js/employeePayroll.js"></script><script src="js/app.js"></script>
</body></html>
