<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Add Employee Payroll</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,600;1,500&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/add-employee.css"></head><body>
<header class="header"><div class="brand"><div class="brand-logo">✦</div><div><div class="brand-title">EMPLOYEE</div><div class="brand-subtitle">PAYROLL</div></div></div><div class="header-title">Add Employee Payroll</div><button class="back-button" onclick="location.href='index.html'">Home</button></header>
<main class="form-page"><section class="form-card"><h1>Add Employee Payroll</h1><p>Employee Payroll Form</p><form id="employeeForm" novalidate><div class="grid"><div class="field full"><label>Name</label><input id="name" type="text"><small id="nameError" class="error"></small></div><div class="field"><label>Profile Picture</label><input id="profilePic" type="file" accept="image/*"></div><div class="field"><label>Gender</label><div class="options"><label><input type="radio" name="gender" value="Male"> Male</label><label><input type="radio" name="gender" value="Female"> Female</label><label><input type="radio" name="gender" value="Other"> Other</label></div></div><div class="field"><label>Department</label><select id="department"><option value="">Select Department</option><option>HR</option><option>Engineering</option><option>Finance</option><option>Sales</option><option>Marketing</option></select></div><div class="field"><label>Salary: ₹<span id="salaryValue">30,000</span></label><input id="salary" type="range" min="10000" max="100000" step="1000" value="30000"></div><div class="field"><label>Start Date</label><input id="startDate" type="date"><small id="dateError" class="error"></small></div><div class="field full"><label>Benefits</label><div class="options"><label><input type="checkbox" name="benefits" value="ESIC"> ESIC</label><label><input type="checkbox" name="benefits" value="PF"> PF</label><label><input type="checkbox" name="benefits" value="Gratuity"> Gratuity</label></div></div><div class="field full"><label>Employee Notes</label><textarea id="notes" rows="4"></textarea></div></div><div id="message"></div><div class="actions"><button class="save">Save</button><button class="reset" type="reset">Reset</button><button class="cancel" type="button" onclick="location.href='index.html'">Cancel</button></div></form></section></main><script src="js/employeePayroll.js"></script><script src="js/add-employee.js"></script></body></html>
