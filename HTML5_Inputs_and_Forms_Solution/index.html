<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML5 Inputs and Forms - Assessment</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="headerContainer">
    <h1>HTML 5 Form Input Fields</h1>
    <p class="subtitle">Class Demo (completed) + Use Case validations, wired with addEventListener</p>
  </header>

  <!-- ============================================================
       PART A: Class demo fields, completed
       (Name, Email, URL, Number, Tel, Search, Date/Time, Range ...)
       ============================================================ -->
  <form id="demoForm" novalidate>

    <fieldset>
      <legend>Basic Input Types (from class demo)</legend>

      <div>
        <label for="url">url input type:</label>
        <input type="url" id="url" name="url" placeholder="https://www.example.com/">
      </div>

      <div>
        <label for="number">number input type:</label>
        <input type="number" id="number" name="number" min="0" max="1000000" step="1" placeholder="e.g. 325235325">
      </div>

      <div>
        <label for="search">search input type:</label>
        <input type="search" id="search" name="search" placeholder="Employability">
      </div>

      <div>
        <label for="party">Choose a date and time:</label>
        <input type="datetime-local" id="party" name="bday">
        <span class="validity-output"></span>
      </div>

      <div>
        <label for="salary">Choose your salary:</label>
        <input type="range" id="salary" name="salary" min="300000" max="500000" step="100" value="400000">
        <output class="salary-output" for="salary">400000</output>
      </div>

      <div>
        <label for="color">color input type:</label>
        <input type="color" id="color" name="color" value="#ff6347">
      </div>

      <div>
        <label for="month">month input type:</label>
        <input type="month" id="month" name="month">
      </div>

      <div>
        <label for="week">week input type:</label>
        <input type="week" id="week" name="week">
      </div>

      <div>
        <label for="fruit">Combo Box (list attribute):</label>
        <input type="text" id="fruit" name="fruit" list="fruitOptions" placeholder="Start typing...">
        <datalist id="fruitOptions">
          <option value="Apple"></option>
          <option value="Banana"></option>
          <option value="Mango"></option>
          <option value="Orange"></option>
        </datalist>
      </div>

      <div>
        <label for="skills">Multiple file upload (multiple attribute):</label>
        <input type="file" id="skills" name="skills" multiple accept="image/*">
      </div>
    </fieldset>

    <!-- ============================================================
         PART B: Use Case fields (event-listener driven validation)
         ============================================================ -->
    <fieldset>
      <legend>Use Case Validations</legend>

      <!-- UC1: First Name must start with a capital letter and be a
           minimum of 3 characters. autofocus + required + pattern demoed here. -->
      <div>
        <label for="firstName">First Name: <span class="rule-hint">(Cap + min 3 chars)</span></label>
        <input type="text" id="firstName" name="firstName" autofocus required
               placeholder="e.g. Ravi" autocomplete="given-name">
        <output class="text-error" for="firstName"></output>
      </div>

      <!-- UC2: Email - abc.xyz@bl.co.in
           3 mandatory parts (abc, bl, co), 2 optional parts (xyz, in) -->
      <div>
        <label for="email">Email: <span class="rule-hint">(e.g. abc.xyz@bl.co.in)</span></label>
        <input type="email" id="email" name="email" required
               placeholder="abc.xyz@bl.co.in" autocomplete="email">
        <output class="text-error" for="email"></output>
      </div>

      <!-- UC3: Mobile - country code, space, 10 digit number -->
      <div>
        <label for="mobile">Mobile: <span class="rule-hint">(e.g. 91 9919819801)</span></label>
        <input type="tel" id="mobile" name="mobile" required
               placeholder="91 9919819801" autocomplete="tel">
        <output class="text-error" for="mobile"></output>
      </div>

      <!-- UC4: Password rules -->
      <div>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required
               placeholder="Choose a password" autocomplete="new-password">
        <ul class="rule-list" id="passwordRules">
          <li id="ruleLen" class="rule">Minimum 8 characters</li>
          <li id="ruleUpper" class="rule">At least 1 upper case letter</li>
          <li id="ruleNum" class="rule">At least 1 numeric digit</li>
          <li id="ruleSpecial" class="rule">Exactly 1 special character</li>
        </ul>
        <output class="text-error" for="password"></output>
      </div>
    </fieldset>

    <div class="submit-row">
      <button type="submit" id="submitBtn">Submit</button>
      <span id="formStatus" class="form-status"></span>
    </div>
  </form>

  <script src="js/script.js"></script>
</body>
</html>
